[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrail"
version = "0.2.0"
description = "Tamper-evident audit trails for AI agents — every action signed, hash-chained and replayable."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "cryptography>=42",
    "jcs>=0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agenttrail-verify = "agenttrail.verify:main"

[tool.setuptools.packages.find]
include = ["agenttrail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
