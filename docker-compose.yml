# Full-stack deployment path: the audit service plus the production-shaped
# infrastructure from the design (Postgres audit store, Kafka event stream,
# WORM object archive). The reference implementation runs on SQLite with no
# Docker for development and tests; compose is for the production layout.
services:
  app:
    build: .
    environment:
      AGENTTRAIL_DATA_DIR: /data
      AGENTTRAIL_LLM_API_KEY: ${AGENTTRAIL_LLM_API_KEY:-}
      AGENTTRAIL_LLM_MODEL: ${AGENTTRAIL_LLM_MODEL:-}
    ports:
      - "8000:8000"
    volumes:
      - agenttrail-data:/data
    depends_on:
      - postgres
      - kafka

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agenttrail
      POSTGRES_USER: agenttrail_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenttrail-dev}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./schema/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # The audit topic is created with cleanup.policy=delete (never
      # compact) and long retention — see README "Design decisions".
    ports:
      - "9092:9092"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  agenttrail-data:
  pg-data:
  minio-data:
